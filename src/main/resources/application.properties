spring.application.name=levelup-store-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:levelup}
spring.datasource.password=${DB_PASSWORD:levelup}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-en-produccion-levelup-store-2025}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}
app.jwt.issuer=levelup-store
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://*:5173,http://*:4173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.login.max-intentos=${LOGIN_MAX_INTENTOS:3}
app.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:5}
